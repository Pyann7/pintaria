<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a228a"/>
      <stop offset="60%" stop-color="#241454"/>
      <stop offset="100%" stop-color="#140a33"/>
    </radialGradient>
    
    <!-- Gold Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#ffd54f"/>
      <stop offset="85%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#d86300"/>
    </linearGradient>

    <!-- 3D Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a38"/>
      <stop offset="100%" stop-color="#e63900"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>

    <!-- Inner Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#09041a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 3D Outer Rim & Disc -->
  <g filter="url(#shadow)">
    <!-- Deep border base -->
    <rect x="8" y="8" width="112" height="112" rx="34" fill="#0f0724"/>
    <rect x="8" y="14" width="112" height="106" rx="34" fill="#070312"/>
    <!-- Gold Bezel -->
    <rect x="10" y="8" width="108" height="108" rx="32" fill="url(#goldGrad)" stroke="#241454" stroke-width="3"/>
    <!-- Inner Screen Plate -->
    <rect x="16" y="14" width="96" height="96" rx="26" fill="url(#bgGrad)" stroke="#1a0d3d" stroke-width="3"/>
  </g>

  <!-- Glossy Reflection Arc -->
  <path d="M 22 22 Q 64 34 106 22 A 26 26 0 0 0 30 18 Z" fill="#ffffff" opacity="0.18"/>

  <!-- Dynamic 3D Runner Character / Mascot Icon -->
  <g transform="translate(64, 56)">
    <!-- Motion Speed Lines -->
    <path d="M -36 -6 L -24 -6 M -40 4 L -22 4 M -34 14 L -20 14" stroke="#ffd54f" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Runner Shadow -->
    <ellipse cx="2" cy="24" rx="20" ry="5.5" fill="#09041a" opacity="0.6"/>

    <!-- Runner Legs (running pose) -->
    <path d="M -7 10 L -15 22 M 7 10 L 16 19 L 24 16" stroke="#241454" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -7 10 L -15 22 M 7 10 L 16 19 L 24 16" stroke="#ffd54f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Runner Torso -->
    <rect x="-10" y="-8" width="20" height="20" rx="7" fill="#ff5fa2" stroke="#241454" stroke-width="3.5"/>
    <circle cx="0" cy="2" r="3" fill="#ffffff"/>

    <!-- Runner Arms -->
    <path d="M -9 -2 L -20 -9 M 9 -2 L 18 5" stroke="#241454" stroke-width="6" stroke-linecap="round"/>
    <path d="M -9 -2 L -20 -9 M 9 -2 L 18 5" stroke="#ff70a6" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Runner Head -->
    <circle cx="2" cy="-20" r="11" fill="#fff9eb" stroke="#241454" stroke-width="3.5"/>
    <!-- Joyful Eyes -->
    <path d="M -1 -21 Q 1 -24 3 -21 M 6 -21 Q 8 -24 10 -21" stroke="#241454" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cap / Helmet -->
    <path d="M -10 -23 Q 3 -33 14 -23 Z" fill="#ff8038" stroke="#241454" stroke-width="3"/>
    <polygon points="12,-25 22,-22 13,-20" fill="#241454"/>
  </g>

  <!-- 3D Pill Badge in Lower Right Corner -->
  <g transform="translate(68, 86)">
    <rect x="0" y="2" width="46" height="26" rx="9" fill="#241454"/>
    <rect x="0" y="0" width="46" height="25" rx="8" fill="url(#pillGrad)" stroke="#241454" stroke-width="2.5"/>
    <text x="23" y="18" font-family="'Lilita One', sans-serif, Impact" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#241454" stroke-width="1.2" paint-order="stroke fill">3D</text>
  </g>

  <!-- Floating Star Badge in Top Left -->
  <g transform="translate(24, 24)">
    <path d="M 0 -8 L 2.5 -2.5 L 8 0 L 2.5 2.5 L 0 8 L -2.5 2.5 L -8 0 L -2.5 -2.5 Z" fill="url(#starGrad)" stroke="#241454" stroke-width="2"/>
  </g>
</svg>
