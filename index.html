<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EduXPlay - Game Kuis 3D</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="top-bar-right">
    <button id="cfg-btn" class="gb alt" onclick="openFirebaseConfigModal()" title="Pengaturan Firebase Realtime Database">⚙️ Server</button>
    <button id="fb" class="gb g-c" onclick="toggleFullScreen()" title="Layar Penuh">Layar Penuh</button>
    <button id="sb" class="gb g-a" onclick="SFX.toggleMute()" title="Suara">Suara Aktif</button>
  </div>
  <div id="hud"></div>
  <div id="rb"></div>
  <div id="rl"></div>
  <div id="vl"></div>
  <div id="qp"></div>
  <div id="ov"></div>

  <!-- Three.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Firebase Realtime Database (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Modular Game Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
